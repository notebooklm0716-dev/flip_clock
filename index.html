<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Clock</title>
  <style>
    /* =========================================
       全体の基本スタイル設定
       ========================================= */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden; /* スクリーン全体ではみ出しスクロールを防止 */
    }

    /* アプリ全体のコンテナ：画面の幅・高さの限界まで自動拡大 */
    .app-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5vw 2.5vw;
      background-color: #1a1a1a;
      border-radius: 2.5vmin;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
      
      /* 画面の縦幅・横幅に合わせて上限いっぱいに自動伸縮 */
      width: min(96vw, 150vh);
      max-height: 92vh;
      aspect-ratio: 16 / 6; /* 時計全体の比率を固定して破綻を防ぐ */
    }

    /* 時計部分のレイアウト */
    .flip-clock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      gap: 1.5%;
    }

    /* コロン（:）のスタイル */
    .colon {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25%;
      height: 100%;
      width: 3%;
    }

    .colon .dot {
      width: 50%;
      aspect-ratio: 1 / 1;
      background-color: #ffffff;
      border-radius: 15%;
    }

    /* =========================================
       フリップアニメーション関連のスタイル
       ========================================= */

    /* 1つの数字ブロック（HH, MM, SS）のコンテナ */
    .flip-unit {
      position: relative;
      width: 28%;
      height: 100%;
      font-weight: bold;
      border-radius: 8%;
      perspective: 1000px; /* 3D効果の深さ */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
      container-type: inline-size; /* 親要素の幅に基づくコンテナクエリ有効化 */
    }

    /* カード共通スタイル */
    .flip-unit > div {
      position: absolute;
      left: 0;
      width: 100%;
      height: calc(50% - 1px);
      overflow: hidden;
      background-color: #333333; /* カードのダークグレー色 */
      color: #ffffff;
      display: flex;
      justify-content: center;
    }

    /* テキストの描画領域 */
    .flip-unit > div::before {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; /* 全体の高さに合わせる */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 82cqi; /* コンテナ幅に完全に比例した文字サイズ */
      line-height: 1;
    }

    /* 上半分のカードのスタイル */
    .top, .top-flip {
      top: 0;
      border-top-left-radius: 8cqi;
      border-top-right-radius: 8cqi;
      transform-origin: bottom;
    }

    .top::before, .top-flip::before {
      top: 0;
    }

    /* 下半分のカードのスタイル */
    .bottom, .bottom-flip {
      bottom: 0;
      border-bottom-left-radius: 8cqi;
      border-bottom-right-radius: 8cqi;
      transform-origin: top;
    }

    .bottom::before, .bottom-flip::before {
      bottom: 0;
    }

    /* 重なり順（z-index）と初期状態の設定 */
    .top { z-index: 2; }
    .bottom { z-index: 1; }
    .top-flip { z-index: 3; transform: rotateX(0deg); }
    .bottom-flip { z-index: 2; transform: rotateX(90deg); }

    /* アニメーション実行時のクラス適用 */
    .flip-unit.flipping .top-flip {
      animation: flipTop 0.3s ease-in forwards;
    }
    .flip-unit.flipping .bottom-flip {
      animation: flipBottom 0.3s ease-out 0.3s forwards;
    }

    /* 上半分のカードが手前に倒れるアニメーション */
    @keyframes flipTop {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }

    /* 下半分のカードが手前に起き上がるアニメーション */
    @keyframes flipBottom {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }
  </style>

    <!-- PWA設定 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
</head>
<body>

  <div class="app-container">
    <div class="flip-clock">
      <div class="flip-unit" id="hours">
        <div class="top" data-val="00"></div>
        <div class="bottom" data-val="00"></div>
        <div class="top-flip" data-val="00"></div>
        <div class="bottom-flip" data-val="00"></div>
      </div>
      
      <div class="colon">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      
      <div class="flip-unit" id="minutes">
        <div class="top" data-val="00"></div>
        <div class="bottom" data-val="00"></div>
        <div class="top-flip" data-val="00"></div>
        <div class="bottom-flip" data-val="00"></div>
      </div>
      
      <div class="colon">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      
      <div class="flip-unit" id="seconds">
        <div class="top" data-val="00"></div>
        <div class="bottom" data-val="00"></div>
        <div class="top-flip" data-val="00"></div>
        <div class="bottom-flip" data-val="00"></div>
      </div>
    </div>
  </div>

  <script>
    /**
     * フリップアニメーションを実行し、値を更新する関数
     * @param {string} id - 対象のDOM要素のID (hours, minutes, seconds)
     * @param {string} newValue - 新しく表示する2桁の数値文字列
     */
    function updateFlipUnit(id, newValue) {
      const unit = document.getElementById(id);
      const top = unit.querySelector('.top');
      const bottom = unit.querySelector('.bottom');
      const topFlip = unit.querySelector('.top-flip');
      const bottomFlip = unit.querySelector('.bottom-flip');

      const currentValue = topFlip.getAttribute('data-val');
      
      if (currentValue === newValue) return;

      top.setAttribute('data-val', currentValue);
      bottom.setAttribute('data-val', currentValue);
      topFlip.setAttribute('data-val', currentValue);
      bottomFlip.setAttribute('data-val', newValue);

      unit.classList.remove('flipping');
      void unit.offsetWidth; // リフローを強制
      
      unit.classList.add('flipping');

      setTimeout(() => {
        top.setAttribute('data-val', newValue);
        bottom.setAttribute('data-val', newValue);
      }, 300);

      setTimeout(() => {
        topFlip.setAttribute('data-val', newValue);
        unit.classList.remove('flipping');
      }, 600);
    }

    /**
     * 時計の更新処理を毎秒実行するメインループ
     */
    function startClock() {
      updateClock();
      setInterval(updateClock, 1000);
    }

    /**
     * 現在時刻を取得して各ユニットを更新する関数
     */
    function updateClock() {
      const now = new Date();
      
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      updateFlipUnit('hours', h);
      updateFlipUnit('minutes', m);
      updateFlipUnit('seconds', s);
    }

    startClock();
  </script>

<!-- PWA_GENERATOR_SW_REGISTRATION -->
<script>
(function () {
    function registerPwaServiceWorker() {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.register("./sw.js")
            .then(function (registration) {
                console.log("Service Worker registered successfully:", registration.scope);
            })
            .catch(function (error) {
                console.error("Service Worker registration failed:", error);
            });
    }
    // window.onload を上書きせず、既存アプリの初期化処理と共存させる
    window.addEventListener("load", registerPwaServiceWorker);
})();
<\/script>
</body>
</html>
